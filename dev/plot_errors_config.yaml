# Plotting configuration for plot_errors_rev.py
# Colors are any matplotlib color: hex ('#RRGGBB'), named ('black') or a
# grayscale level as a quoted string ('0.88').

# --- Run settings (used when the script is run as __main__)
# Evaluation year: selects the results files (*_det_<year>, *_prob_<year>,
# *_ri_<year>) and the IBTrACS ground truth, and tags the output file names
year: 2023
# Basin to evaluate (NA, EP, WP, NI, SI, SP or SA), or null for all basins.
# The all-basin results are restricted to the forecasts initialized while the
# storm is in that basin (IBTrACS basin at the initial time); output file names
# are then tagged <year>_<basin>
basin: null
# Folder holding the IBTrACS file (ibtracs.ALL.list...csv), read to find the
# forecasts of the basin
ibtracs_tracks_path: "/home/mgomezd1/repos/idea_testing/ibtracs"
# Folder with the evaluation results and the IBTrACS ground truth
result_folder: "/home/mgomezd1/repos/idea_testing/outputs_rev"
# Folder the summary CSVs and figures are written to (created if missing)
plotting_folder: "/home/mgomezd1/repos/idea_testing/outputs_rev/plotting_csvs"
# Evaluated lead times in hours, from start to stop (both included) every step
lead_hours:
  start: 6
  stop: 120
  step: 6

# --- Models and metrics

# Display name per model (raw names as in the results file names)
pretty_names:
  "2023_PANGU_adj": "Pangu"
  "2023_TIGGE_GEFS": "GEFS"
  "2023_TIGGE_IFS": "IFS"
  "2023_aifs_adj": "AIFS"
  "2023_fcnet_adj": "FCNet"
  "2023_fnv3p2": "FNV3P2"
  "2023_postprocessing_panguweather_ANN_LeakyReLU,_M": "Postprocessed Pangu (ANN)"
  "2023_postprocessing_panguweather_MLR_Masked": "Postprocessed Pangu (MLR)"
  "2023_postprocessing_panguweather_UNetv2_dout_0.33": "Postprocessed Pangu (UNet)"
  "CLIM-intensity-y2023": "Mean Tendency (CLIM)"
  "PERSIST-intensity-y2023": "Persistence"
  "gencast": "GenCast"

# Line style per model (raw names) in the lead-time panels; others are solid
model_linestyles:
  # "2023_TIGGE_GEFS": "--"
  # "2023_TIGGE_IFS": "--"
  # "gencast": "--"
  # "2023_fnv3p2": "--"
  "2023_postprocessing_panguweather_ANN_LeakyReLU,_M": "--"
  "2023_postprocessing_panguweather_MLR_Masked": "--"
  "2023_postprocessing_panguweather_UNetv2_dout_0.33": "--"

# Hatch of the same models (those with a model_linestyles entry) in bar panels
# (single quotes: backslashes are taken literally)
model_hatch: '\\\'
# Hatch of the same models in the scorecard cells
scorecard_hatch: '\\\'

# Models (raw names) excluded from all summaries, coverage and plots, with the
# reason for excluding them
ignored_models:
  "2023_postprocessing_panguweather_MLR_Masked": "only shown in RI due to crowding"
  "2023_postprocessing_panguweather_UNetv2_dout_0.33": "only shown in RI due to crowding"
  "SHIP": "not shown in main plots because it's basin specific"
  "HMON": "not shown in main plots because it's basin specific"
  "HWFI": "not shown in main plots because it's basin specific"
  # "2023_TIGGE_IFS": "not shown in basin plots due to crowding"
  # "2023_PANGU_adj": "not shown in basin plots due to crowding"
  # "2023_fcnet_adj": "not shown in basin plots due to crowding"
  # "gencast": "not shown in basin plots due to crowding"
  
  

# Per-case metric columns summarized from the results files
det_columns:
  - AbsErr_wind_max
  - AbsErr_pressure_min
  - SquErr_wind_max
  - SquErr_pressure_min
  - DirPosErr
  - AlongTrack
  - CrossTrack

prob_columns:
  - FairCRPS_wind_max
  - FairCRPS_pressure_min
  - TrackCRPS
  - ProbCircle_hit70

# Model colors, assigned in plotting order (cycled if there are more models)
max_distinct:
  - "#CA5234"  # (202, 82, 52)
  - "#1EB9A4"  # (30, 185, 164)
  - "#8A3231"  # (138, 50, 49)
  - "#4D3C8F"  # (77, 60, 143)
  - "#3C854E"  # (60, 133, 78)
  - "#007389"  # (0, 115, 137)
  - "#AB51BA"  # (171, 81, 186)
  - "#D48E48"  # (212, 142, 72)
  - "#837D2E"  # (131, 125, 46)
  - "#DE857D"  # (222, 133, 125)
  - "#CD4976"  # (205, 73, 118)
  # "#DE81C2" (222, 129, 194) is used for MT-LB (climatology inspired baseline)
  - "#A693DA"  # (166, 147, 218)
  - "#7F326A"  # (127, 50, 106)
  - "#556DBC"  # (85, 109, 188)
  - "#55A8D5"  # (85, 168, 213)
  - "#72B955"  # (114, 185, 85)
  - "#3A5612"  # (58, 86, 18)
  - "#BFAE47"  # (191, 174, 71)
  - "#7E4C09"  # (126, 76, 9)

# Baseline styles
persist_color: "black"
clim_color: "#DE81C2"  # (222, 129, 194)

# Scorecard colors: improvement vs persistence (honolulu blue), degradation
# (vivid rose), and hit fraction (white to bamboo)
scorecard_better: "#2271B2"
scorecard_worse: "#EB057A"
scorecard_coverage: "#D55E00"
scorecard_missing: "0.88"
# Skill-score panels (e.g. RI BSS): white (0) to ocean green (max)
scorecard_score_low: "white"
scorecard_score_high: "#359B73"
# Calibration panels (frequency of the observed position inside the
# probability circle): below nominal
# (underdispersive, purple) to above nominal (overdispersive, amber)
scorecard_underdispersive: "#8400CD"
scorecard_overdispersive: "#FFB000"

# Variable whose coverage applies to each metric
metric_coverage_variable:
  AbsErr_wind_max: wind_max
  SquErr_wind_max: wind_max
  AbsErr_pressure_min: pressure_min
  SquErr_pressure_min: pressure_min
  DirPosErr: position
  AlongTrack: position
  CrossTrack: position
  RI_CSI: wind_max
  RI_BSS: wind_max
  FairCRPS_wind_max: wind_max
  FairCRPS_pressure_min: pressure_min
  TrackCRPS: position
  ProbCircle_hit70: position
